<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Claude Pet 设置</title>
<style>
  :root {
    --coral: #CC785C; --coral-deep: #B05C40;
    --cream: #F0EEE6; --ink: #3D3929;
    --line: rgba(176, 92, 64, 0.25);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    background: var(--cream); color: var(--ink);
    padding: 20px 22px; font-size: 13px; user-select: none;
  }
  h1 { font-size: 17px; font-weight: 700; margin-bottom: 14px; }
  h1 .spark { color: var(--coral); }
  fieldset {
    border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 14px; background: rgba(255,255,255,0.55);
  }
  legend { padding: 0 6px; font-weight: 600; color: var(--coral-deep); font-size: 12.5px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 7px 0; }
  .row label { flex: 0 0 78px; color: #6b6453; }
  .row input[type="text"], .row input[type="number"] {
    flex: 1; padding: 6px 9px; border: 1px solid var(--line); border-radius: 7px;
    background: #fff; color: var(--ink); font-size: 12.5px; outline: none;
  }
  .row input:focus { border-color: var(--coral); }
  .check { display: flex; align-items: center; gap: 7px; margin: 7px 0; cursor: pointer; }
  .check input { accent-color: var(--coral); width: 15px; height: 15px; cursor: pointer; }
  .hint { color: #948b76; font-size: 11.5px; margin: 4px 0 0 0; line-height: 1.5; }
  .btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
  button {
    padding: 8px 22px; border-radius: 8px; border: 1px solid var(--line);
    background: #fff; color: var(--ink); font-size: 13px; cursor: pointer;
  }
  button.primary { background: var(--coral); border-color: var(--coral); color: #fff; font-weight: 600; }
  button.primary:hover { background: var(--coral-deep); }
  #saved { color: var(--coral-deep); font-size: 12px; align-self: center; margin-right: auto; opacity: 0; transition: opacity .3s; }
  #saved.show { opacity: 1; }
</style>
</head>
<body>
  <h1><span class="spark">✦</span> Claude Pet 设置</h1>

  <fieldset>
    <legend>远程源（vibe 服务器）</legend>
    <label class="check"><input type="checkbox" id="srcEnabled"> 启用远程监控</label>
    <div class="row"><label>名称</label><input type="text" id="srcName" placeholder="vibe"></div>
    <div class="row"><label>地址</label><input type="text" id="srcUrl" placeholder="http://127.0.0.1:47600"></div>
    <div class="row"><label>Token</label><input type="text" id="srcToken" placeholder="（无则留空）"></div>
    <div class="row"><label>SSO 站点</label><input type="text" id="ssoOrigin" placeholder="https://vibe.corp.tujia.com（仅代理模式）"></div>
    <p class="hint">SSH 隧道模式填 http://127.0.0.1:47600，SSO 站点留空；代理模式填 proxy 地址 + SSO 站点。</p>
  </fieldset>

  <fieldset>
    <legend>本机监控（Mac 上的 Claude Code）</legend>
    <label class="check"><input type="checkbox" id="localEnabled"> 自动监控本机 ~/.claude（内置 agent，无需手动启动）</label>
    <div class="row"><label>本地端口</label><input type="number" id="localPort" placeholder="47601"></div>
    <p class="hint">开启后桌宠自动拉起一个本地 agent，同时监控本机与远程，状态取两边里最需要你的。</p>
  </fieldset>

  <fieldset>
    <legend>通知与提示音</legend>
    <label class="check"><input type="checkbox" id="notifyOnWaiting"> 等待你时弹系统通知</label>
    <label class="check"><input type="checkbox" id="soundOnWaiting"> 等待你时播放提示音</label>
    <label class="check"><input type="checkbox" id="notifyOnDone"> 任务完成时弹系统通知</label>
    <label class="check"><input type="checkbox" id="soundOnDone"> 任务完成时播放提示音</label>
  </fieldset>

  <div class="btns">
    <span id="saved">✓ 已保存并生效</span>
    <button id="cancel">关闭</button>
    <button id="save" class="primary">保存并生效</button>
  </div>

<script src="settings.js"></script>
</body>
</html>
